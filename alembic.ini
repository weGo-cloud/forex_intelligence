[alembic]
script_location = migrations
prepend_sys_path = .

# Timezone-naive, UTC-based revision file timestamps for consistency
# with the rest of the system's UTC-only timestamp policy.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is deliberately NOT set here: the real connection
# string comes from app.core.config.get_settings() (DATABASE_URL env
# var), wired up in migrations/env.py. This keeps a single source of
# truth for the database URL and avoids a second place secrets could
# accidentally be committed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
