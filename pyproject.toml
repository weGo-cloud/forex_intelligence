[project]
name = "forex-intelligence"
version = "0.1.0"
description = "Quantitative forex research and analysis platform (research and paper-trading only)."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "pandas>=2.2,<4.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]
vectorbt = [
    # Optional alternative execution backend for app.backtesting.vbt_engine.
    # BacktestEngine (app/backtesting/engine.py) has no dependency on this
    # and works standalone - install this extra only if you want the
    # VectorBT-backed engine for parameter sweeps / walk-forward at scale.
    "vectorbt>=0.26,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
